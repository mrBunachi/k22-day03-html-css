<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 3 - Hoàng DTR</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/856c95e1e2.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <h1>Liên hệ</h1>
    <p>
      F8 luôn lắng nghe và tiếp nhận mọi ý kiến đóng góp của bạn. Hãy liên hệ với chúng mình bằng cách điền thông tin
      vào form dưới đây. Chúng mình sẽ phản hồi bạn trong thời gian sớm nhất.
    </p>

    <div class="contact-box">
      <!-- Cột bên trái: Thông tin & Form -->
      <div class="contact-left">
        <ul class="thongtin">
          <li>
            <i class="fa-regular fa-house"></i>
            Số 1, ngõ 41, Trần Duy Hưng, Cầu Giấy, Hà Nội
          </li>
          <li><a href="tel:0819198989">08 1919 8989</a></li>
          <li><a href="mailto:contact@f8.edu.vn">contact@f8.edu.vn</a></li>
        </ul>

        <form class="lienhe-form">
          <div class="form-group">
            <label for="fullname">Họ và tên</label>
            <input type="text" id="fullname" placeholder="Nhập tên đầy đủ..." />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Nhập email..." />
          </div>

          <div class="form-group">
            <label for="phone">Điện thoại</label>
            <input type="tel" id="phone" placeholder="Nhập số điện thoại..." />
          </div>

          <div class="form-group">
            <label for="content">Nội dung</label>
            <textarea id="content" rows="5" placeholder="Nhập nội dung liên hệ..."></textarea>
          </div>

          <div class="btn-box">
            <button type="submit" class="btn">Gửi đi</button>
          </div>
        </form>
      </div>

      <!-- Cột bên phải: Google Map -->
      <div class="contact-right">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3724.4994603859427!2d105.79999947503104!3d21.012692280632645!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ab4df3c6c329%3A0xd8e14fe61fd32604!2zQ8OUTkcgVFkgQ-G7lCBQSOG6pk4gQ8OUTkcgTkdI4buGIEdJw4FPIEThu6RDIEY4!5e0!3m2!1svi!2sau!4v1785845628253!5m2!1svi!2sau"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
    </div>
  </body>
</html>
