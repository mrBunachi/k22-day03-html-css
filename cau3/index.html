<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 3 - Hoàng DTR</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/856c95e1e2.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="header">
      <h1>Liên hệ</h1>
      <p>
        F8 luôn lắng nghe và tiếp nhận mọi ý kiến đóng góp của bạn. Hãy liên hệ với chúng mình bằng cách điền thông tin
        vào form dưới đây. Chúng mình sẽ phản hồi bạn trong thời gian sớm nhất.
      </p>
    </div>
    <div class="container">
      <div class="left">
        <div class="info">
          <i class="fa-solid fa-house"></i>
          <p>Số 1, ngõ 41, Trần Duy Hưng, Cầu Giấy, Hà Nội</p>
        </div>
        <div class="info">
          <i class="fa-solid fa-phone"></i>
          <p>08 1919 8989</p>
        </div>
        <div class="info">
          <i class="fa-solid fa-envelope"></i>
          <p>contact@f8.edu.vn</p>
        </div>
        <form action="/xu-ly-data" method="POST">
          <div class="form-group">
            <label for="fullname">Họ và tên</label>
            <input type="text" id="fullname" placeholder="Nhập tên đầy đủ ..." />
          </div>
          <div class="form-group">
            <label for="gmail">Email</label>
            <input type="text" id="gmail" placeholder="Nhập email..." />
          </div>
          <div class="form-group">
            <label for="phone">Điện thoại</label>
            <input type="number" id="phone" placeholder="Nhập số điện thoại..." />
          </div>
          <div class="form-group">
            <label for="message">Nội dung</label>
            <input type="text" id="message" placeholder="Nhập nội dung liên hệ..." />
          </div>
        </form>
        <button class="btn" type="submit">Gửi đi</button>
      </div>
      <div class="right">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3724.499459902349!2d105.8025744!3d21.012692299999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ab4df3c6c329%3A0xd8e14fe61fd32604!2zQ8OUTkcgVFkgQ-G7lCBQSOG6pk4gQ8OUTkcgTkdI4buGIEdJw4FPIEThu6RDIEY4!5e0!3m2!1svi!2s!4v1786069170838!5m2!1svi!2s"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
    </div>
  </body>
</html>
